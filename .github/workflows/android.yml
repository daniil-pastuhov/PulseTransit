name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Ktlint
        run: ./gradlew ktlintCheck --stacktrace

      - name: Run Detekt
        run: ./gradlew detekt --stacktrace

      - name: Run Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload Static Analysis Reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: static-analysis-reports
          path: |
            **/build/reports/lint-results-debug.html
            **/build/reports/detekt/detekt.xml
            **/build/reports/ktlint/*.txt

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/

  instrumentation-tests:
    name: Instrumentation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        api-level: [29] # Can add more versions here
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Instrumentation Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload Instrumentation Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumentation-test-reports
          path: app/build/reports/androidTests/connected/

  build:
    name: Build Release
    runs-on: ubuntu-latest
    environment: Release
    env:
      # Play needs a strictly increasing versionCode; the run number only ever grows.
      pulseVersionCode: ${{ github.run_number }}
      # A flag rather than the key itself: secrets stay scoped to the one step that needs them,
      # since PR runs execute the PR branch's own Gradle scripts.
      HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release.jks

      - name: Build Release APK and Bundle
        run: ./gradlew assembleRelease bundleRelease --stacktrace
        env:
          pulseReleaseFile: ../release.jks
          pulseReleaseKeyAlias: ${{ secrets.RELEASE_KEY_ALIAS }}
          pulseReleaseKeyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}
          pulseReleaseStorePassword: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab

      # Skipped when the PLAY_SERVICE_ACCOUNT_JSON secret is absent (e.g. on a fork).
      - name: Publish to Google Play (internal track)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_PLAY_KEY == 'true'
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"
          ./gradlew publishReleaseBundle --artifact-dir app/build/outputs/bundle/release publishReleaseListing --stacktrace
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          pulsePlayCredentials: ${{ runner.temp }}/play-service-account.json
          pulsePlayReleaseStatus: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
