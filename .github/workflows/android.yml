name: Android CI

# Release flow (scripts/release starts it; see "Releasing" in README.MD):
# - Each push to a release/vX.Y.Z branch publishes the bundle and the store listing to the Play
#   internal track, with the notes in release-notes/vX.Y.Z/.
# - Merging that branch's PR promotes the internal release to closed testing (alpha) and tags
#   vX.Y.Z.
# Main itself publishes nothing. The release jobs live in this workflow, not a separate one,
# because the Play version code is this workflow's run number.
on:
  push:
    branches: [ main, "release/v*" ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, closed ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Release-branch pushes are never cancelled, so a Play upload is never cut off halfway, and
  # neither is the run that promotes a merged release PR.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') && github.event.action != 'closed' }}

jobs:
  static-analysis:
    name: Static Analysis
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Ktlint
        run: ./gradlew ktlintCheck --stacktrace

      - name: Run Detekt
        run: ./gradlew detekt --stacktrace

      - name: Run Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload Static Analysis Reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: static-analysis-reports
          path: |
            **/build/reports/lint-results-debug.html
            **/build/reports/detekt/detekt.xml
            **/build/reports/ktlint/*.txt

  unit-tests:
    name: Unit Tests
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/

  instrumentation-tests:
    name: Instrumentation Tests
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        api-level: [29] # Can add more versions here
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Instrumentation Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload Instrumentation Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumentation-test-reports
          path: app/build/reports/androidTests/connected/

  build:
    name: Build Release
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment: Release
    env:
      # Play needs a strictly increasing versionCode; the run number only ever grows.
      pulseVersionCode: ${{ github.run_number }}
      # A flag rather than the key itself: secrets stay scoped to the one step that needs them,
      # since PR runs execute the PR branch's own Gradle scripts.
      HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release.jks

      - name: Build Release APK and Bundle
        run: ./gradlew assembleRelease bundleRelease --stacktrace
        env:
          pulseReleaseFile: ../release.jks
          pulseReleaseKeyAlias: ${{ secrets.RELEASE_KEY_ALIAS }}
          pulseReleaseKeyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}
          pulseReleaseStorePassword: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Stage the release notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/v')
        run: scripts/stage-release-notes.sh "${GITHUB_REF_NAME#release/v}"

      # Skipped when the PLAY_SERVICE_ACCOUNT_JSON secret is absent (e.g. on a fork).
      - name: Publish to Google Play (internal track)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/v') && env.HAS_PLAY_KEY == 'true'
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"
          ./gradlew publishReleaseBundle --artifact-dir app/build/outputs/bundle/release \
            --release-name "$RELEASE_VERSION ($pulseVersionCode)" publishReleaseListing --stacktrace
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          pulsePlayCredentials: ${{ runner.temp }}/play-service-account.json
          # "completed" rolls each build out to the track's testers; the repository variable
          # PLAY_RELEASE_STATUS can set "draft" to leave the rollout to Play Console instead.
          pulsePlayReleaseStatus: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}

  # --- Merged release PR: move the tested build on to closed testing ---------------------------

  promote:
    name: Promote to Google Play closed testing
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.merged && startsWith(github.head_ref, 'release/v')
    runs-on: ubuntu-latest
    environment: Release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Stage the release notes
        run: scripts/stage-release-notes.sh "${GITHUB_HEAD_REF#release/v}"

      # The internal track's release is the build testers have been trying; it is promoted as is
      # rather than rebuilt from the merge commit.
      - name: Promote internal to closed testing
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"
          ./gradlew promoteReleaseArtifact --from-track internal --promote-track alpha --stacktrace
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          pulsePlayCredentials: ${{ runner.temp }}/play-service-account.json
          pulsePlayReleaseStatus: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}

  tag-release:
    name: Tag the release
    needs: promote
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Tag and create a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          VERSION=${GITHUB_HEAD_REF#release/v}
          gh release create "v$VERSION" --target "$MERGE_SHA" --title "$VERSION" \
            --notes-file "release-notes/v$VERSION/en-US.txt"
