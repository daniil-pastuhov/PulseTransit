name: iOS CI

# The iOS half of the release flow in android.yml (scripts/release starts it; see "Releasing" in
# README.MD):
# - Every PR and push builds the iOS app and runs the shared tests on the iOS simulator.
# - Each push to a release/vX.Y.Z branch uploads a TestFlight build for internal testers, with the
#   notes in release-notes/vX.Y.Z/. The build number is this workflow's run number.
# - Merging that branch's PR sends the tested build to the external testers group, alongside the
#   Play promotion to closed testing.
on:
  push:
    branches: [ main, "release/v*" ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, closed ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # As in android.yml: never cut off a TestFlight upload or the run that promotes a merged release.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') && github.event.action != 'closed' }}

jobs:
  build:
    name: Build and test (iOS)
    if: github.event.action != 'closed'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The Kotlin/Native toolchain is a large download; keep it between runs.
      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Run shared tests on the iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      - name: Build the iOS app
        run: |
          xcodebuild build -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-test-reports
          path: shared/build/reports/tests/iosSimulatorArm64Test/

  testflight:
    name: Upload to TestFlight
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/v')
    runs-on: macos-latest
    environment: Release
    env:
      # A flag rather than the key itself, as in android.yml; skipped on forks without the secret.
      HAS_ASC_KEY: ${{ secrets.ASC_KEY_P8 != '' }}
      # Install exactly what Gemfile.lock pins: these steps hold the App Store Connect key.
      BUNDLE_FROZEN: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: iosApp

      - name: Check the version and release notes
        run: |
          VERSION=${GITHUB_REF_NAME#release/v}
          grep -q "MARKETING_VERSION = $VERSION$" iosApp/Configuration/Config.xcconfig ||
            { echo "::error::iosApp/Configuration/Config.xcconfig MARKETING_VERSION is not $VERSION"; exit 1; }
          for locale in en-US no-NO; do
            [ -s "release-notes/v$VERSION/$locale.txt" ] ||
              { echo "::error::missing release notes: release-notes/v$VERSION/$locale.txt"; exit 1; }
          done
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build and upload
        if: env.HAS_ASC_KEY == 'true'
        working-directory: iosApp
        run: bundle exec fastlane beta version:"$RELEASE_VERSION" build_number:"${{ github.run_number }}"
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}

  promote:
    name: Send to TestFlight external testers
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.merged && startsWith(github.head_ref, 'release/v')
    runs-on: macos-latest
    environment: Release
    env:
      BUNDLE_FROZEN: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: iosApp

      # The build internal testers have been trying is distributed as is, not rebuilt.
      - name: Distribute to external testers
        working-directory: iosApp
        run: bundle exec fastlane promote version:"${GITHUB_HEAD_REF#release/v}"
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TESTFLIGHT_EXTERNAL_GROUP: ${{ vars.TESTFLIGHT_EXTERNAL_GROUP || 'External testers' }}
