name: CodeQL

# Replaces GitHub's default code scanning setup, whose autobuild runs `./gradlew assemble`. That
# includes the release build, whose Crashlytics mapping upload fails under CodeQL's build tracer,
# so Kotlin was never scanned. Here Kotlin is built from the debug variant instead, which uploads
# nothing; the other languages need no build.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
          - language: python
            build-mode: none
          - language: ruby
            build-mode: none
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: set up JDK 21
        if: matrix.build-mode == 'manual'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        if: matrix.build-mode == 'manual'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # CodeQL only sees code the compiler runs on while it traces, so nothing may come from the
      # build cache. :app's debug build compiles :shared's Android target, commonMain included.
      - name: Build Kotlin
        if: matrix.build-mode == 'manual'
        run: ./gradlew :app:assembleDebug --no-build-cache --stacktrace

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
