name: CI

# Android and iOS in one workflow, so a run shows every job on one screen. The jobs start in
# parallel once `changes` has decided which apps a PR touches; only tagging waits, for the Play
# promotion.
#
# Release flow (scripts/release starts it; see "Releasing" in README.MD):
# - Every PR checks and builds the apps it touches (`changes`), except a release PR: its branch's
#   pushes already do, on the same commit, and always both apps. Main is not built on push; its PRs
#   were checked before merging.
# - Each push to a release/vX.Y.Z branch publishes the bundle and the store listing to the Play
#   internal track and uploads a TestFlight build for internal testers, with the notes in
#   release-notes/vX.Y.Z/.
# - Merging that branch's PR promotes the internal Play release to closed testing (alpha), submits
#   the TestFlight build for App Store review (released once Apple approves it), and tags vX.Y.Z.
# Main itself publishes nothing. Run by hand (workflow_dispatch), it only submits the given version's
# TestFlight build to the App Store, for a release whose merge did not.
on:
  workflow_dispatch:
    inputs:
      app_store_version:
        description: "Version (X.Y.Z) whose newest TestFlight build to submit to the App Store"
        required: true
  push:
    branches: [ "release/v*" ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, closed ]

concurrency:
  # A run started by hand gets a group of its own, so a later push to the same branch, whose run
  # decides the cancelling, cannot cut its App Store submission off.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && '-dispatch' || '' }}
  # Release-branch pushes are never cancelled, so a store upload is never cut off halfway, and
  # neither is the run that promotes a merged release PR or submits a version by hand.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') && github.event.action != 'closed' && github.event_name != 'workflow_dispatch' }}

# Read-only unless a job asks for more (changes, tag-release), so the token stays read-only even if
# the repository's default for workflow tokens is ever widened.
permissions:
  contents: read

env:
  # The Play versionCode and the iOS build number are this run number plus this base. The base
  # carries the numbering on from the old android.yml (last run 73) and ios.yml, whose run
  # numbers this workflow does not inherit; Play rejects a versionCode that is not higher than
  # every earlier one. Never lower it.
  BUILD_NUMBER_BASE: 1000

jobs:
  # Which apps a PR touches, so the other app's jobs (the macOS ones above all) can be skipped, and
  # both when only docs or release notes changed. Done here rather than with paths-ignore on the
  # trigger: a release push always builds both apps, since publishing depends on those jobs, even
  # when it only changes release notes. Skipped jobs count as passed for required checks.
  changes:
    name: Detect changes
    if: >-
      github.event.action != 'closed' && github.event_name != 'workflow_dispatch' &&
      !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists a PR's files through the API, without a checkout
    outputs:
      android: ${{ github.event_name != 'pull_request' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.android == 'true' }}
      # Whether code that runs on the emulator changed; lint config, scripts or the store listing
      # alone do not need the instrumentation tests.
      android_code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.android_code == 'true' }}
      ios: ${{ github.event_name != 'pull_request' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.ios == 'true' }}
      # Whether the Kotlin code ios-build tests on the simulator changed; Swift-only changes skip it.
      shared: ${{ github.event_name != 'pull_request' || steps.filter.outputs.shared == 'true' }}
    steps:
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # The workflow itself and the Gradle build count as shared: they can break either app.
          filters: |
            shared:
              - 'shared/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - '.editorconfig' # ktlint's rules
              - '.github/**'
            android:
              - 'app/**'
              - 'config/**'
              - 'scripts/sync-ios-strings.py'
              - 'scripts/stage-release-notes.sh'
              - 'iosApp/iosApp/Localizable.xcstrings'
            android_code:
              - 'app/src/main/java/**'
              - 'app/src/main/res/**'
              - 'app/src/main/AndroidManifest.xml'
              - 'app/src/androidTest/**'
              - 'app/*.gradle.kts'
            ios:
              - 'iosApp/**'
              - 'scripts/build-shared-framework.sh'

  # --- Android ----------------------------------------------------------------------------------

  # Static analysis and unit tests share one job, so the JDK and Gradle are set up and the build
  # configured once.
  android-checks:
    name: "Android: Static Analysis and Unit Tests"
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Check the iOS string catalog matches the Android strings
        run: scripts/sync-ios-strings.py --check

      # --continue reports every tool's findings, not just the first one's.
      - name: Run Ktlint, Detekt and Lint
        id: static-analysis
        run: ./gradlew ktlintCheck detekt lintDebug :shared:lint --continue --stacktrace

      # Runs even when static analysis failed, so one run reports both.
      - name: Run Unit Tests
        if: ${{ !cancelled() }}
        # The unit tests live in :shared's commonTest; this runs them on the JVM. The iOS run of the
        # same tests is in ios-build.
        run: ./gradlew :shared:testAndroidHostTest testDebugUnitTest --stacktrace

      - name: Upload Static Analysis Reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() && steps.static-analysis.outcome == 'failure'
        with:
          name: static-analysis-reports
          retention-days: 7
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/detekt/detekt.xml
            **/build/reports/ktlint/*.txt

      - name: Upload Test Reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: unit-test-reports
          retention-days: 7
          path: shared/build/reports/tests/testAndroidHostTest/

  android-instrumentation-tests:
    name: "Android: Instrumentation Tests"
    needs: changes
    if: needs.changes.outputs.android_code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        api-level: [29] # Can add more versions here
    steps:
      # The emulator needs ~7.4 GB free for its userdata partition, and ubuntu-latest leaves ~7.3 GB;
      # short of it, the emulator dies at launch while the action waits out its boot timeout.
      # Neither `disk-size` nor the AVD's config changes what it asks for, so make room instead by
      # dropping toolchains this job never uses (the Android SDK stays).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Instrumentation Tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          # A healthy boot takes a minute or two; the default 600 s only delays a failure.
          emulator-boot-timeout: 300
          script: ./gradlew connectedDebugAndroidTest :shared:connectedAndroidDeviceTest --stacktrace

      - name: Upload Instrumentation Test Reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: instrumentation-test-reports
          retention-days: 7
          path: |
            app/build/reports/androidTests/connected/
            shared/build/reports/androidTests/connected/

  android-build:
    name: "Android: Build Release"
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: Release
    env:
      # A flag rather than the key itself: secrets stay scoped to the one step that needs them,
      # since PR runs execute the PR branch's own Gradle scripts.
      HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      # Dependabot's PRs run without the repository's secrets; their release build is left unsigned.
      HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # Play needs a strictly increasing versionCode; the run number only ever grows.
      - name: Set the version code
        run: echo "pulseVersionCode=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_BASE))" >> "$GITHUB_ENV"

      - name: Require the keystore for a release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/v') && env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::RELEASE_KEYSTORE_BASE64 is not set; a release build must be signed."
          exit 1

      - name: Decode Keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release.jks

      - name: Build Release APK and Bundle
        run: ./gradlew assembleRelease bundleRelease --stacktrace
        env:
          # Blank leaves the release build type without a signing config (app/build.gradle.kts).
          pulseReleaseFile: ${{ env.HAS_KEYSTORE == 'true' && '../release.jks' || '' }}
          pulseReleaseKeyAlias: ${{ secrets.RELEASE_KEY_ALIAS }}
          pulseReleaseKeyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}
          pulseReleaseStorePassword: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}

      - name: Upload Release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          # Artifacts count against the repository's storage quota; scripts/install-ci-apk.sh only
          # needs a recent one.
          retention-days: 14

      - name: Upload Release Bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Stage the release notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/v')
        run: scripts/stage-release-notes.sh "${GITHUB_REF_NAME#release/v}"

      # Skipped when the PLAY_SERVICE_ACCOUNT_JSON secret is absent (e.g. on a fork).
      - name: Publish to Google Play (internal track)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/v') && env.HAS_PLAY_KEY == 'true'
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"
          ./gradlew publishReleaseBundle --artifact-dir app/build/outputs/bundle/release \
            --release-name "$RELEASE_VERSION ($pulseVersionCode)" publishReleaseListing --stacktrace
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          pulsePlayCredentials: ${{ runner.temp }}/play-service-account.json
          # "completed" rolls each build out to the track's testers; the repository variable
          # PLAY_RELEASE_STATUS can set "draft" to leave the rollout to Play Console instead.
          pulsePlayReleaseStatus: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}

  # --- iOS --------------------------------------------------------------------------------------

  ios-build:
    name: "iOS: Build and Test"
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # The Kotlin/Native toolchain is a large download; keep it between runs.
      - name: Cache Kotlin/Native
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Run shared tests on the iOS simulator
        if: needs.changes.outputs.shared == 'true'
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      # Not on a release push: ios-testflight archives the app from the same commit, which compiles
      # everything this would. A generic destination builds the Swift packages for every simulator
      # architecture (the app target already excludes x86_64), so it is narrowed to arm64.
      - name: Build the iOS app
        if: github.event_name != 'push'
        run: |
          xcodebuild build -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: ios-test-reports
          retention-days: 7
          path: shared/build/reports/tests/iosSimulatorArm64Test/

  # Runs alongside ios-build rather than after it, as the Play upload does alongside the Android
  # tests: a failing check still shows up red in the release PR before it is merged.
  ios-testflight:
    name: "iOS: Upload to TestFlight"
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/v')
    runs-on: macos-latest
    # Includes waiting for App Store Connect to process the build.
    timeout-minutes: 60
    environment: Release
    env:
      # A flag rather than the key itself, as for Play; skipped on forks without the secret.
      HAS_ASC_KEY: ${{ secrets.ASC_KEY_P8 != '' }}
      # Install exactly what Gemfile.lock pins: these steps hold the App Store Connect key.
      BUNDLE_FROZEN: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Cache Kotlin/Native
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: iosApp

      - name: Check the version and release notes
        run: |
          VERSION=${GITHUB_REF_NAME#release/v}
          grep -q "MARKETING_VERSION = $VERSION$" iosApp/Configuration/Config.xcconfig ||
            { echo "::error::iosApp/Configuration/Config.xcconfig MARKETING_VERSION is not $VERSION"; exit 1; }
          for locale in en-US no-NO; do
            [ -s "release-notes/v$VERSION/$locale.txt" ] ||
              { echo "::error::missing release notes: release-notes/v$VERSION/$locale.txt"; exit 1; }
          done
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_BASE))" >> "$GITHUB_ENV"

      - name: Build and upload
        if: env.HAS_ASC_KEY == 'true'
        working-directory: iosApp
        run: bundle exec fastlane beta version:"$RELEASE_VERSION" build_number:"$BUILD_NUMBER"
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}

  # --- Merged release PR: move the tested builds on to closed testing / the App Store ------------

  android-promote:
    name: "Android: Promote to closed testing"
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.merged && startsWith(github.head_ref, 'release/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Stage the release notes
        run: scripts/stage-release-notes.sh "${GITHUB_HEAD_REF#release/v}"

      # The internal track's release is the build testers have been trying; it is promoted as is
      # rather than rebuilt from the merge commit.
      - name: Promote internal to closed testing
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"
          ./gradlew promoteReleaseArtifact --from-track internal --promote-track alpha --stacktrace
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          pulsePlayCredentials: ${{ runner.temp }}/play-service-account.json
          pulsePlayReleaseStatus: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}

  ios-release:
    name: "iOS: Submit to the App Store"
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event_name == 'pull_request' && github.event.action == 'closed' &&
        github.event.pull_request.merged && startsWith(github.head_ref, 'release/v'))
    runs-on: macos-latest
    timeout-minutes: 20
    environment: Release
    env:
      BUNDLE_FROZEN: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: iosApp

      # The build internal testers have been trying is submitted as is, not rebuilt.
      - name: Submit for App Store review
        working-directory: iosApp
        run: bundle exec fastlane release version:"${APP_STORE_VERSION:-${GITHUB_HEAD_REF#release/v}}"
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APP_STORE_VERSION: ${{ inputs.app_store_version }}

  tag-release:
    name: Tag the release
    needs: android-promote
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Tag and create a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          VERSION=${GITHUB_HEAD_REF#release/v}
          gh release create "v$VERSION" --target "$MERGE_SHA" --title "$VERSION" \
            --notes-file "release-notes/v$VERSION/en-US.txt"
